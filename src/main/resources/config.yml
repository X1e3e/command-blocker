# Режим синхронизации ролей:
# "rcon" (роли синхронизируются через RCON команды с сайта и хранятся в players.yml)
# "db" (роли считываются напрямую из базы данных сайта users.db)
sync-mode: "rcon"
database-path: "plugins/BlockCommand/users.db"

# Список разрешенных команд для обычных игроков (без косой черты /)
# Команды должны быть записаны в нижнем регистре.
allowed-commands:
  - msg
  - me
  - try
  - login
  - changepassword
  - register
  - help

# Дополнительные роли (права) и команды, к которым они дают доступ
roles:
  detective:
    # Игрок с этим правом получит доступ к командам роли
    permission: "blockcommand.role.detective"
    # Дополнительные разрешенные команды для роли.
    # Если указана только команда (например, "spawn"), то разрешена вся команда.
    # Если указана команда с аргументами (например, "co i"), то разрешено выполнение
    # этой команды, если её начало совпадает с указанной строкой (регистр не важен).
    commands:
      - "co i"
      - "co inspect"

# Настройки прав доступа
permissions:
  # Право, позволяющее обходить блокировку и использовать любые команды
  bypass: "blockcommand.bypass"
  # Право для перезагрузки конфигурации (/blockcommand reload)
  admin: "blockcommand.admin"

# Сообщения (поддерживаются стандартные цветовые коды &)
messages:
  # Сообщение, которое видит игрок при попытке использовать запрещенную команду
  blocked: "&cУ вас нет доступа к этой команде!"
  # Сообщение при успешной перезагрузке конфигурации
  reload-success: "&aКонфигурация плагина BlockCommand успешно перезагружена!"
  # Сообщение при попытке перезагрузить конфиг без прав
  no-permission: "&cНедостаточно прав!"

# Описания команд для вывода в /help
help-descriptions:
  msg: "Отправить личное сообщение игроку"
  me: "Действие от третьего лица"
  try: "Попробовать совершить действие (случайный результат)"
  changepassword: "Сменить пароль от вашего аккаунта"
  login: "Авторизоваться на сервере"
  register: "Зарегистрироваться на сервере"
  help: "Показать список доступных команд"
  co i: "Инспектирование блоков (CoreProtect)"
  co inspect: "Инспектирование блоков (CoreProtect)"
  blockcommand reload: "Перезагрузить конфигурацию плагина"
  blockcommand grant: "Выдать роль игроку"
  blockcommand revoke: "Забрать роль у игрока"
  blockcommand list: "Показать роли игрока или доступные роли"

